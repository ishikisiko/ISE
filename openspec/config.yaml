schema: spec-driven

context: |
  智能搜索引擎（ISE）：证据接地、可审计的检索问答系统。
  Python + LangChain/LangGraph + Flask；conda 环境 `env1`；入口 main.py（CLI）与 server.py（Web）。

  ## 架构方向由路线图决定，不由 specs 决定

  `docs/agentic_loop_roadmap.md` 是架构方向的唯一权威。M0-M5 已把默认运行时
  收敛成单一 agentic loop（工具面由 skill 派生，模型选工具，确定性 preflight
  与 critic 兜底）；分类器、静态 plan、postcheck fallback 和 engine flag 已退出。

  `openspec/specs/` 只描述**各能力当前的契约**，不承担"系统应该长成什么样"。
  与路线图冲突时以路线图为准。

  ## specs 状态

  M5 退出后现行 19 份 spec 全部是 `Status: active`。迁移期的 reframing / superseded
  分类只作为 roadmap 和 archive 中的历史记录；退役能力的现行 spec 已删除。

  ## 全程不变量（任何 change 都不得破坏）

  I1 每条被引用证据可追溯到一次具体工具调用，provenance 链不断
  I2 任何执行路径下 audit 记录完整
  I3 外部调用的参数合法性由确定性代码裁决，LLM 判断不具备最终裁决权
  I4 工具调用次数、token、时延均有上界，且可配置、可观测
  I5 每个改动自身可发布可回退；迁移期 feature flag 在 M5 收敛后必须删除

  ## 惯例

  Python 遵循 PEP 8 与 snake_case；保留既有类型注解与简洁 docstring。
  配置读 config.json（可用 NLP_CONFIG_PATH 覆盖），密钥不入库。
  测试用 pytest，`python -m pytest` 可跑。

rules:
  proposal:
    - 必须写明服务于路线图的哪个里程碑；若与任何里程碑无关，先说明理由
    - 不得重新引入已退役的分类器、静态 plan、postcheck fallback、engine flag
      或第二套编排器/执行路径（legacy SmartSearchOrchestrator 已删除）
    - 必须说明如何满足不变量 I1–I5，或说明为何不适用
  design:
    - 净代码量预期为负的改动优先；预期净增代码时须说明理由
  tasks:
    - 任务需可独立验证，并标明对应的退出判据
